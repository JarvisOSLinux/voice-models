name: Validate PR

# Blocking PR gate for the registry. Validates registry.json and every
# models/<id>/model.json (identity, enums, mirrored fields, integrity hash,
# source shape, orphan directories) and enforces that a model cannot be promoted
# to the `official` tier without a maintainer applying the `trust-approved`
# label. See docs/REGISTRY-GUIDE.md § "Trust model".
#
# The self-test runs first: it builds throwaway registries in a temp dir and
# asserts the validator still rejects what it is supposed to reject, so a gate
# that has quietly stopped firing fails here instead of passing everything.
#
# Both steps are offline. Artifact hashes are the submitter's to compute and the
# reviewer's to check (docs/REGISTRY-GUIDE.md § "Integrity philosophy"); CI never
# downloads a model, so a multi-gigabyte entry costs the same as a small one.
#
# `labeled`/`unlabeled` are included so the run re-evaluates when a maintainer
# adds or removes the approval label.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Self-test the validation logic
        run: python3 scripts/selftest_registry.py

      - name: Fetch base registry.json
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show "FETCH_HEAD:registry.json" > /tmp/base_registry.json \
            || echo '{}' > /tmp/base_registry.json

      - name: Validate registry
        run: |
          python3 scripts/validate_registry.py \
            --base /tmp/base_registry.json \
            ${{ contains(github.event.pull_request.labels.*.name, 'trust-approved') && '--approval-label-present' || '' }}

      - name: Check registry.json is in sync with the manifests
        run: python3 scripts/sync_registry.py --check
